<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="./todo.js"></script>
</head>

<body>
    <div class="container w-full h-full bg-white">
        <div class="todo-container bg-blue-200 mx-auto round-10 w-3/4 p-8">
            <div class="todo-form p-4  w-md shadow-xl bg-blue-100 mx-auto ">
                <div class="form-group space-y-4">
                    <label for="title">Title</label><br>
                    <input type="text" class="border-2 w-full border-black px-4 py-2 rounded-4" name="title" id="title">
                </div>
                <div class="form-group">
                    <label for="description">description</label><br>
                    <input type="text" class="border-2 w-full border-black px-4 py-2 rounded-4" name="description" id="description">
                </div>
                <div class="form-group">
                    <label for="deadline">Deadline</label><br>
                    <input type="date" class="border-2 w-full border-black px-4 py-2 rounded-4" name="deadline" id="deadline">
                </div>
                <button onclick="addTask()" class="py-2 px-4 my-4 round-10 bg-blue-700 hover:bg-blue-900 w-full">Add Task</button>                
            </div>
            <div class="todoTable">
                <button onclick="completeAll()">Complete All</button>
                <table>
                    <thead>
                        <tr>
                            <th>title</th>
                            <th>description</th>
                            <th>created at</th>
                            <th>deadline</th>
                            <th>Completed</th>
                            <th>Delete</th>
                        </tr>
                    </thead>
                    <tbody id="data">
                    </tbody>
                </table>
            </div>
        </div>
    </div>        
</body>
</html>
