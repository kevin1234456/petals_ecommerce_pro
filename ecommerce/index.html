<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petals - Premium Flower Shop</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            transition: all 0.3s ease;
        }
        @keyframes addToCart {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .animate-add {
            animation: addToCart 0.5s ease;
        }
        .product-image-hover:hover img {
            transform: scale(1.1);
        }
        .modal-slide-in {
            transform: translateX(100%);
        }
        .modal-slide-in.active {
            transform: translateX(0);
        }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800">
    <!-- Header -->
    <header class="bg-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4">
            <div class="flex flex-col md:flex-row justify-between items-center space-y-4 md:space-y-0">
                <!-- Logo -->
                <div class="flex items-center space-x-2">
                    <i class="fas fa-spa text-pink-500 text-2xl"></i>
                    <h1 class="text-2xl md:text-3xl font-serif font-bold text-pink-500">Petals</h1>
                </div>
                
                <!-- Search -->
                <div class="relative w-full md:w-auto md:flex-1 max-w-xl mx-0 md:mx-8">
                    <i class="fas fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="search-input" 
                           class="w-full pl-12 pr-4 py-3 rounded-full border border-gray-300 focus:outline-none focus:ring-2 focus:ring-green-300 focus:border-transparent" 
                           placeholder="Search for flowers, bouquets...">
                </div>
                
                <!-- Cart Button -->
                <button id="open-cart" 
                        class="bg-green-500 hover:bg-green-600 text-white px-6 py-3 rounded-full flex items-center space-x-2 transition-all duration-300 transform hover:-translate-y-1 shadow-md">
                    <i class="fas fa-shopping-cart"></i>
                    <span>Cart</span>
                    <span id="cart-count" class="bg-pink-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-sm">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        <!-- Page Title -->
        <div class="text-center mb-12">
            <h2 class="text-4xl md:text-5xl font-serif font-bold text-pink-500 mb-4">Beautiful Flowers for Every Occasion</h2>
            <p class="text-gray-600 max-w-2xl mx-auto">Find the perfect bouquet for birthdays, anniversaries, or just to brighten someone's day</p>
        </div>
        
        <!-- Filters -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 space-y-4 md:space-y-0">
            <!-- Category Filters -->
            <div class="flex flex-wrap gap-2">
                <button class="filter-btn bg-green-500 text-white px-4 py-2 rounded-full text-sm" data-category="all">All Flowers</button>
                <button class="filter-btn bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded-full text-sm" data-category="bouquets">Bouquets</button>
                <button class="filter-btn bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded-full text-sm" data-category="roses">Roses</button>
                <button class="filter-btn bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded-full text-sm" data-category="tulips">Tulips</button>
                <button class="filter-btn bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded-full text-sm" data-category="lilies">Lilies</button>
                <button class="filter-btn bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded-full text-sm" data-category="succulents">Succulents</button>
            </div>
            
            <!-- Price Sort -->
            <div class="flex items-center space-x-2">
                <span class="text-gray-700">Sort by:</span>
                <select id="price-sort" 
                        class="border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-300">
                    <option value="default">Default</option>
                    <option value="price-low">Price: Low to High</option>
                    <option value="price-high">Price: High to Low</option>
                </select>
            </div>
        </div>
        
        <!-- Products Grid -->
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 mb-12">
            <!-- Products will be loaded dynamically -->
        </div>
    </main>
    
    <!-- Cart Modal -->
    <div id="cart-modal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden justify-end">
        <div class="modal-slide-in w-full max-w-md h-full bg-white overflow-y-auto">
            <div class="p-6 border-b border-gray-200 flex justify-between items-center">
                <h3 class="text-2xl font-serif font-bold text-gray-800">Your Shopping Cart</h3>
                <button id="close-cart" class="text-gray-500 hover:text-gray-700 text-2xl">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <!-- Cart Items -->
            <div id="cart-items" class="p-6">
                <!-- Cart items will be loaded dynamically -->
            </div>
            
            <!-- Cart Summary -->
            <div id="cart-summary" class="p-6 border-t border-gray-200">
                <!-- Cart summary will be loaded dynamically -->
            </div>
        </div>
    </div>
    
    <!-- Footer -->
    <footer class="bg-gray-900 text-white py-12">
        <div class="container mx-auto px-4">
            <div class="flex flex-col items-center space-y-4">
                <div class="flex items-center space-x-2 text-xl">
                    <i class="fas fa-spa text-pink-400"></i>
                    <h3 class="font-serif font-bold">Petals</h3>
                </div>
                <p class="text-gray-400">Bringing beauty to your doorstep since 2023</p>
                <p class="text-gray-400">123 Flower Street, Garden City, GC 10001</p>
                <p class="text-gray-400">contact@petals.com | (555) 123-4567</p>
            </div>
        </div>
    </footer>

    <script>
        // Flower products data
        const products = [
            {
                id: 1,
                name: "Classic Rose Bouquet",
                description: "A dozen red roses arranged elegantly",
                price: 49.99,
                category: "roses",
                image: "https://images.unsplash.com/photo-1519378058457-4c29a0a2efac?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 2,
                name: "Spring Tulip Mix",
                description: "Colorful tulips to brighten any room",
                price: 39.99,
                category: "tulips",
                image: "https://images.unsplash.com/photo-1582794543139-8ac9cb0f7b11?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 3,
                name: "Elegant Lily Arrangement",
                description: "White lilies with delicate greenery",
                price: 59.99,
                category: "lilies",
                image: "https://images.unsplash.com/photo-1560717782-d5e4123b3c3e?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 4,
                name: "Succulent Garden",
                description: "Low-maintenance succulent collection",
                price: 34.99,
                category: "succulents",
                image: "https://images.unsplash.com/photo-1485955900006-10f4d324d411?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 5,
                name: "Mixed Flower Bouquet",
                description: "Seasonal flowers in a beautiful arrangement",
                price: 44.99,
                category: "bouquets",
                image: "https://images.unsplash.com/photo-1442323794357-25b2ec110967?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 6,
                name: "Pink Rose Bouquet",
                description: "Soft pink roses symbolizing admiration",
                price: 52.99,
                category: "roses",
                image: "https://images.unsplash.com/photo-1519225421980-715cb0215aed?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 7,
                name: "Exotic Orchid Plant",
                description: "Elegant orchid in a decorative pot",
                price: 64.99,
                category: "bouquets",
                image: "https://images.unsplash.com/photo-1574323347407-f5e1ad6d020b?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 8,
                name: "Sunflower Bouquet",
                description: "Bright sunflowers to spread happiness",
                price: 41.99,
                category: "bouquets",
                image: "https://images.unsplash.com/photo-1597848212624-e4f8db565c13?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80"
            }
        ];

        // Cart state
        let cart = JSON.parse(localStorage.getItem('petals-cart')) || [];

        // DOM elements
        const productsGrid = document.getElementById('products-grid');
        const cartModal = document.getElementById('cart-modal');
        const openCartBtn = document.getElementById('open-cart');
        const closeCartBtn = document.getElementById('close-cart');
        const cartItems = document.getElementById('cart-items');
        const cartSummary = document.getElementById('cart-summary');
        const cartCount = document.getElementById('cart-count');
        const searchInput = document.getElementById('search-input');
        const filterButtons = document.querySelectorAll('.filter-btn');
        const priceSort = document.getElementById('price-sort');

        // Initialize the page
        document.addEventListener('DOMContentLoaded', function() {
            renderProducts(products);
            updateCartCount();
            loadCart();
            
            // Event listeners
            openCartBtn.addEventListener('click', openCart);
            closeCartBtn.addEventListener('click', closeCart);
            
            // Close cart when clicking outside
            cartModal.addEventListener('click', function(e) {
                if (e.target === cartModal) {
                    closeCart();
                }
            });
            
            // Search functionality
            searchInput.addEventListener('input', handleSearch);
            
            // Filter functionality
            filterButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    filterButtons.forEach(b => {
                        b.classList.remove('bg-green-500', 'text-white');
                        b.classList.add('bg-gray-200', 'hover:bg-gray-300');
                    });
                    this.classList.remove('bg-gray-200', 'hover:bg-gray-300');
                    this.classList.add('bg-green-500', 'text-white');
                    
                    const category = this.dataset.category;
                    filterProducts(category);
                });
            });
            
            // Price sort functionality
            priceSort.addEventListener('change', handlePriceSort);
        });

        // Render products to the page
        function renderProducts(productsToRender) {
            productsGrid.innerHTML = '';
            
            if (productsToRender.length === 0) {
                productsGrid.innerHTML = `
                    <div class="col-span-full text-center py-12">
                        <i class="fas fa-leaf text-gray-300 text-6xl mb-4"></i>
                        <p class="text-gray-500 text-lg">No flowers found matching your criteria.</p>
                    </div>
                `;
                return;
            }
            
            productsToRender.forEach(product => {
                const isInCart = cart.some(item => item.id === product.id);
                
                const productCard = document.createElement('div');
                productCard.className = 'bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition-shadow duration-300 transform hover:-translate-y-1';
                productCard.innerHTML = `
                    <div class="product-image-hover overflow-hidden h-56">
                        <img src="${product.image}" alt="${product.name}" class="w-full h-full object-cover transition-transform duration-500">
                        <span class="absolute top-3 left-3 bg-yellow-400 text-gray-800 text-xs font-semibold px-3 py-1 rounded-full">${product.category}</span>
                    </div>
                    <div class="p-5">
                        <h3 class="text-lg font-semibold text-gray-800 mb-2">${product.name}</h3>
                        <p class="text-gray-600 text-sm mb-3 h-10 overflow-hidden">${product.description}</p>
                        <div class="flex justify-between items-center">
                            <span class="text-xl font-bold text-pink-500">$${product.price.toFixed(2)}</span>
                            <button class="add-to-cart-btn ${isInCart ? 'bg-green-500' : 'bg-pink-500 hover:bg-pink-600'} text-white px-4 py-2 rounded-lg flex items-center space-x-2 transition-colors duration-300" data-id="${product.id}">
                                <i class="fas fa-${isInCart ? 'check' : 'cart-plus'}"></i>
                                <span>${isInCart ? 'Added' : 'Add to Cart'}</span>
                            </button>
                        </div>
                    </div>
                `;
                
                productsGrid.appendChild(productCard);
                
                // Add event listener to the add to cart button
                const addToCartBtn = productCard.querySelector('.add-to-cart-btn');
                addToCartBtn.addEventListener('click', function() {
                    addToCart(product);
                    this.classList.remove('bg-pink-500', 'hover:bg-pink-600');
                    this.classList.add('bg-green-500');
                    this.innerHTML = `<i class="fas fa-check"></i><span>Added</span>`;
                    
                    // Add animation
                    this.classList.add('animate-add');
                    setTimeout(() => {
                        this.classList.remove('animate-add');
                    }, 500);
                });
            });
        }

        // Cart functionality
        function addToCart(product) {
            // Check if product already in cart
            const existingItemIndex = cart.findIndex(item => item.id === product.id);
            
            if (existingItemIndex > -1) {
                // Increase quantity if already in cart
                cart[existingItemIndex].quantity += 1;
            } else {
                // Add new item to cart
                cart.push({
                    ...product,
                    quantity: 1
                });
            }
            
            // Update localStorage
            localStorage.setItem('petals-cart', JSON.stringify(cart));
            
            // Update UI
            updateCartCount();
            if (cartModal.classList.contains('flex')) {
                renderCartItems();
            }
        }

        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);
            localStorage.setItem('petals-cart', JSON.stringify(cart));
            updateCartCount();
            renderCartItems();
            renderProducts(products); // Update product buttons
        }

        function updateCartQuantity(productId, newQuantity) {
            if (newQuantity < 1) {
                removeFromCart(productId);
                return;
            }
            
            const itemIndex = cart.findIndex(item => item.id === productId);
            if (itemIndex > -1) {
                cart[itemIndex].quantity = newQuantity;
                localStorage.setItem('petals-cart', JSON.stringify(cart));
                renderCartItems();
            }
        }

        function updateCartCount() {
            const totalItems = cart.reduce((total, item) => total + item.quantity, 0);
            cartCount.textContent = totalItems;
        }

        function loadCart() {
            renderCartItems();
        }

        function renderCartItems() {
            cartItems.innerHTML = '';
            
            if (cart.length === 0) {
                cartItems.innerHTML = `
                    <div class="text-center py-12">
                        <i class="fas fa-shopping-cart text-gray-300 text-5xl mb-4"></i>
                        <p class="text-gray-500 text-lg mb-2">Your cart is empty</p>
                        <p class="text-gray-400">Add some beautiful flowers to brighten your day!</p>
                    </div>
                `;
                
                cartSummary.innerHTML = '';
                return;
            }
            
            // Render cart items
            cart.forEach(item => {
                const cartItem = document.createElement('div');
                cartItem.className = 'flex items-center py-4 border-b border-gray-200';
                cartItem.innerHTML = `
                    <div class="w-20 h-20 rounded-lg overflow-hidden mr-4">
                        <img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover">
                    </div>
                    <div class="flex-1">
                        <h4 class="font-semibold text-gray-800">${item.name}</h4>
                        <p class="text-pink-500 font-bold">$${item.price.toFixed(2)}</p>
                        <div class="flex items-center mt-2">
                            <button class="quantity-btn decrement w-7 h-7 rounded-full border border-gray-300 flex items-center justify-center hover:bg-gray-100" data-id="${item.id}">
                                <i class="fas fa-minus text-xs"></i>
                            </button>
                            <span class="quantity mx-3 font-semibold">${item.quantity}</span>
                            <button class="quantity-btn increment w-7 h-7 rounded-full border border-gray-300 flex items-center justify-center hover:bg-gray-100" data-id="${item.id}">
                                <i class="fas fa-plus text-xs"></i>
                            </button>
                            <button class="remove-item ml-4 text-red-500 hover:text-red-700" data-id="${item.id}">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
                cartItems.appendChild(cartItem);
            });
            
            // Calculate totals
            const subtotal = cart.reduce((total, item) => total + (item.price * item.quantity), 0);
            const tax = subtotal * 0.08; // 8% tax
            const shipping = subtotal > 50 ? 0 : 9.99;
            const total = subtotal + tax + shipping;
            
            // Render summary
            cartSummary.innerHTML = `
                <div class="space-y-3 mb-6">
                    <div class="flex justify-between">
                        <span class="text-gray-600">Subtotal</span>
                        <span class="font-semibold">$${subtotal.toFixed(2)}</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-600">Tax</span>
                        <span class="font-semibold">$${tax.toFixed(2)}</span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-gray-600">Shipping</span>
                        <span class="font-semibold">${shipping === 0 ? 'FREE' : '$' + shipping.toFixed(2)}</span>
                    </div>
                    <div class="border-t border-gray-300 pt-3 flex justify-between text-lg">
                        <span class="font-bold">Total</span>
                        <span class="font-bold text-pink-500">$${total.toFixed(2)}</span>
                    </div>
                </div>
                <button class="checkout-btn w-full bg-green-500 hover:bg-green-600 text-white py-4 rounded-lg font-semibold text-lg transition-colors duration-300 flex items-center justify-center space-x-2">
                    <i class="fas fa-lock"></i>
                    <span>Proceed to Checkout</span>
                </button>
            `;
            
            // Add event listeners to cart item controls
            document.querySelectorAll('.quantity-btn.decrement').forEach(btn => {
                btn.addEventListener('click', function() {
                    const productId = parseInt(this.dataset.id);
                    const item = cart.find(item => item.id === productId);
                    if (item) {
                        updateCartQuantity(productId, item.quantity - 1);
                    }
                });
            });
            
            document.querySelectorAll('.quantity-btn.increment').forEach(btn => {
                btn.addEventListener('click', function() {
                    const productId = parseInt(this.dataset.id);
                    const item = cart.find(item => item.id === productId);
                    if (item) {
                        updateCartQuantity(productId, item.quantity + 1);
                    }
                });
            });
            
            document.querySelectorAll('.remove-item').forEach(btn => {
                btn.addEventListener('click', function() {
                    const productId = parseInt(this.dataset.id);
                    removeFromCart(productId);
                });
            });
        }

        // Modal functions
        function openCart() {
            cartModal.classList.remove('hidden');
            cartModal.classList.add('flex');
            setTimeout(() => {
                document.querySelector('.modal-slide-in').classList.add('active');
            }, 10);
            renderCartItems();
        }

        function closeCart() {
            document.querySelector('.modal-slide-in').classList.remove('active');
            setTimeout(() => {
                cartModal.classList.remove('flex');
                cartModal.classList.add('hidden');
            }, 300);
        }

        // Search functionality
        function handleSearch() {
            const searchTerm = searchInput.value.toLowerCase();
            const filteredProducts = products.filter(product => 
                product.name.toLowerCase().includes(searchTerm) || 
                product.description.toLowerCase().includes(searchTerm) ||
                product.category.toLowerCase().includes(searchTerm)
            );
            renderProducts(filteredProducts);
        }

        // Filter functionality
        function filterProducts(category) {
            let filteredProducts;
            if (category === 'all') {
                filteredProducts = products;
            } else {
                filteredProducts = products.filter(product => product.category === category);
            }
            renderProducts(filteredProducts);
        }

        // Price sort functionality
        function handlePriceSort() {
            const sortValue = priceSort.value;
            let sortedProducts = [...products];
            
            if (sortValue === 'price-low') {
                sortedProducts.sort((a, b) => a.price - b.price);
            } else if (sortValue === 'price-high') {
                sortedProducts.sort((a, b) => b.price - a.price);
            }
            
            renderProducts(sortedProducts);
        }
    </script>
</body>
</html>
